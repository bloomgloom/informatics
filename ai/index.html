<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인공지능 기초</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f7fafc; color: #172033; font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
      main { width: min(1120px, calc(100% - 48px)); margin: 0 auto; padding: 64px 0; }
      a { color: #2563eb; font-weight: 800; text-decoration: none; }
      .back { font-size: 18px; }
      h1 { margin: 48px 0 34px; font-size: clamp(44px, 7vw, 82px); line-height: 1; }
      .chapter { overflow: hidden; border: 2px solid #d7e0ea; border-radius: 12px; background: #fff; box-shadow: 0 10px 30px rgba(23, 32, 51, 0.06); }
      .chapter-main { display: grid; grid-template-columns: 116px 1fr auto; align-items: center; gap: 24px; min-height: 118px; padding: 22px 26px; color: inherit; }
      .number { color: #7c3aed; font-size: 42px; font-weight: 900; }
      .title { display: grid; gap: 6px; }
      .title b { font-size: clamp(28px, 3vw, 40px); line-height: 1.12; }
      .title span { color: #5c6b7d; font-size: 18px; }
      .action { border-radius: 999px; padding: 12px 18px; background: #f3efff; color: #7c3aed; font-size: 18px; transition: background 160ms ease, transform 160ms ease; }
      .action:hover { background: #e9e0ff; transform: translateY(-1px); }
      .resources { display: grid; gap: 1px; padding: 0 26px 22px 166px; }
      .resource-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 20px; padding: 15px 0; border-top: 1px solid #e5eaf0; }
      .resource-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .resource-title strong { overflow: hidden; color: #293449; font-size: 17px; text-overflow: ellipsis; white-space: nowrap; }
      .activity-label { flex: 0 0 auto; border-radius: 999px; padding: 5px 9px; background: #f1f5f9; color: #64748b; font-size: 13px; font-weight: 900; }
      .downloads { display: flex; gap: 8px; }
      .download { display: inline-flex; align-items: center; justify-content: center; min-width: 82px; border: 1px solid #d8ccf8; border-radius: 8px; padding: 9px 12px; background: #fff; color: #6d28d9; font-size: 14px; transition: border-color 160ms ease, background 160ms ease; }
      .download:hover { border-color: #a78bfa; background: #faf8ff; }
      .download.csv { border-color: #b9e1d0; color: #047857; }
      .download.csv:hover { border-color: #6fc4a3; background: #f3fbf7; }
      a:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
      @media (max-width: 720px) {
        main { width: min(100% - 28px, 1120px); padding: 36px 0; }
        h1 { margin: 36px 0 26px; }
        .chapter-main { grid-template-columns: 1fr; gap: 12px; padding: 22px; }
        .action { width: max-content; }
        .resources { padding: 0 22px 14px; }
        .resource-row { grid-template-columns: 1fr; gap: 12px; }
        .resource-title { align-items: flex-start; }
        .resource-title strong { overflow: visible; white-space: normal; }
        .downloads { flex-wrap: wrap; }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="../">← 정보 교과군</a>
      <h1>인공지능 기초</h1>
      <article class="chapter">
        <div class="chapter-main">
          <span class="number">2-1</span>
          <span class="title">
            <b>기계학습과 데이터</b>
            <span>기계학습의 개념과 데이터로 학습하기</span>
          </span>
          <a class="action" href="./ch2-1/">열기</a>
        </div>
        <div class="resources" aria-label="2-1 실습 자료">
          <div class="resource-row">
            <div class="resource-title">
              <span class="activity-label">실습 1</span>
              <strong>펭귄 데이터 탐색하기</strong>
            </div>
            <div class="downloads">
              <a class="download" href="./ch2-1/2-1_실습1_펭귄_데이터_탐색하기.ipynb" download>노트북</a>
              <a class="download csv" href="./ch2-1/penguins_size.csv" download>CSV</a>
            </div>
          </div>
          <div class="resource-row">
            <div class="resource-title">
              <span class="activity-label">선택 활동</span>
              <strong>지진 데이터 분석하기</strong>
            </div>
            <div class="downloads">
              <a class="download" href="./ch2-1/2-1_선택활동_지진_데이터_분석하기.ipynb" download>노트북</a>
              <a class="download csv" href="./ch2-1/earthquake.csv" download>CSV</a>
            </div>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
