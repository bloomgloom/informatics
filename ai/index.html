<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인공지능 기초</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f7fafc; color: #172033; font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
      main { width: min(1120px, calc(100% - 48px)); margin: 0 auto; padding: 64px 0; }
      a { color: #2563eb; font-weight: 800; text-decoration: none; }
      .back { font-size: 18px; }
      h1 { margin: 48px 0 34px; font-size: clamp(44px, 7vw, 82px); line-height: 1; }
      .chapter { display: grid; grid-template-columns: 116px 1fr auto; align-items: center; gap: 24px; min-height: 118px; border: 2px solid #d7e0ea; border-radius: 8px; padding: 22px 26px; background: #fff; color: inherit; box-shadow: 0 10px 30px rgba(23, 32, 51, 0.06); }
      .number { color: #7c3aed; font-size: 42px; font-weight: 900; }
      .title { display: grid; gap: 6px; }
      .title b { font-size: clamp(28px, 3vw, 40px); line-height: 1.12; }
      .title span { color: #5c6b7d; font-size: 18px; }
      .action { border-radius: 999px; padding: 12px 18px; background: #f3efff; color: #7c3aed; font-size: 18px; }
      @media (max-width: 720px) { .chapter { grid-template-columns: 1fr; gap: 12px; } .action { width: max-content; } }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="../">← 정보 교과군</a>
      <h1>인공지능 기초</h1>
      <a class="chapter" href="./ch2-1/">
        <span class="number">2-1</span>
        <span class="title">
          <b>기계학습과 데이터</b>
          <span>기계학습의 개념과 데이터로 학습하기</span>
        </span>
        <span class="action">열기</span>
      </a>
    </main>
  </body>
</html>
