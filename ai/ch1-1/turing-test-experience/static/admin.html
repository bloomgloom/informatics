<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교사 관리 · 튜링 테스트</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div id="busyStatus" class="busy-status hidden" role="status" aria-live="polite">처리 중입니다…</div><main class="shell"><header class="topbar"><div class="brand"><span class="brand-mark">T?</span>교사 콘솔</div><div class="chips"><span class="chip" id="phase">인증 필요</span><span class="chip dark" id="round">수업 준비</span></div></header>
<div id="message"></div><div id="login" class="card"><h1>수업 준비</h1><p class="muted">서버를 켤 때 정한 비밀번호를 입력합니다. API 키와 비밀번호는 파일에 저장되지 않으며, 서버를 끄면 사라집니다.</p><div class="stack"><label>비밀번호<input type="password" id="token" autocomplete="off"></label><button class="btn primary" id="configure">연결 확인</button></div></div>
<div id="app" class="hidden"><section class="hero"><div class="eyebrow">TEACHER CONTROL</div><h1 id="progressTitle">학생 참여를 기다리는 중</h1><div class="progress"><span id="progressBar" style="width:0"></span></div><p id="progressText"></p><div class="row"><button class="btn primary" id="mainAction">게임 시작</button><button class="btn" id="finish">종료</button><button class="btn" id="export">CSV 내보내기</button><button class="btn danger" id="reset">전체 초기화</button></div></section>
<div class="admin-layout"><section class="card"><div class="row between"><h2>좌석 현황</h2><span class="muted">좌석을 눌러 상세 보기</span></div><div class="seat-grid" id="seats"></div></section><aside class="stack"><section class="card"><h2>API 사용량</h2><div class="metric-grid"><div class="metric"><span>호출</span><b id="calls">0</b></div><div class="metric"><span>입력 토큰</span><b id="inputTokens">0</b></div><div class="metric"><span>출력 토큰</span><b id="outputTokens">0</b></div></div><p class="muted" id="model"></p></section><section class="card"><h2>알림</h2><div id="alerts" class="muted">알림이 없습니다.</div></section></aside></div></div></main><div id="modal" class="dialog-backdrop hidden"><div class="dialog card" id="modalBody"></div></div><script src="/static/admin.js"></script></body></html>
